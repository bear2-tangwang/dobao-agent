# ==================== GitHub OAuth 登录 ====================
# ⚠️ 会话 Cookie 按主机名隔离，端口不影响。下面两个地址的主机名必须与「浏览器里访问
#   前端的地址」完全一致（redirect-uri 是 GitHub 回跳地址，frontend-base-url 是授权后
#   浏览器的落点），并同时与 GitHub OAuth App 里登记的 callback URL 一致。
#   混用 localhost 与 127.0.0.1 会让 authorize 写入的 state 落在另一个站点，回跳时带不上
#   Cookie，用户只会看到 ?error=state（"登录状态已过期"）。前端登录页会比对主机名并提示。
github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:Ov23liQzhSR9SuuqMuwX}
    client-secret: ${GITHUB_CLIENT_SECRET:831fea2ecc9541b5084af809fdc248e4a329d431}
    # 访问 github.com 的 HTTP CONNECT 代理。JVM 不读 Windows 系统代理设置，
    # 浏览器能打开 GitHub 不等于后端能连上（api.github.com 直连是通的，只配这个就够）。
    # 只作用于 GitHub 这两次调用。不需要代理时置空：GITHUB_PROXY_HOST=
    proxy-host: ${GITHUB_PROXY_HOST:127.0.0.1}
    proxy-port: ${GITHUB_PROXY_PORT:7892}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://127.0.0.1:8888/oauth/github/callback}
    # 登录成功后浏览器要落回的前端地址（授权失败时也用它提示）
    frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5173}
    # 未登录时业务数据归属的兜底用户，与三张表 user_id 列的 DEFAULT 'default' 对齐，
    # 这样历史数据在未登录时仍然照常可见。
    default-user-id: default
    # 登录态在 Session 里占用的键名
    session-user-key: DOBAO_UID
    # GET /auth/diagnostics（登录链路诊断：当前会话 id、会话里有没有 state）。
    # 生产务必改成 false —— 它会暴露会话 id。
    diagnostics-enabled: true
