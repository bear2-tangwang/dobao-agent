server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    session:
      # 登录态保留 30 天
      timeout: 30d
      cookie:
        # Spring Session 的 DefaultCookieSerializer 会继承下面这几项；
        # 引入 spring-session-jdbc 后 Cookie 名默认是 SESSION，这里显式改名。
        name: DOBAO_SID
        http-only: true
        same-site: lax
        # 生产 HTTPS 改成 true
        # secure: true
spring:
  ai:
    openai:
      api-key: sk-ws-H.PDDLIYX.wIJn.MEUCICfSvx4nZ0tIXuDp0Jrlha-kRZtLDGqq0_tN1NCG3BaEAiEAqpG_UabBDWOWtiV27pK6VRVWJPEEXA3EUUXuKSGf9Zw
      base-url: https://ws-ae41waoyh0yzb53i.cn-beijing.maas.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: qwen3.7-flash-2026-07-15
          temperature: 0.7
          maxTokens: 10000

      embedding:
        base-url: https://ws-ae41waoyh0yzb53i.cn-beijing.maas.aliyuncs.com/compatible-mode/
        api-key: sk-ws-H.PDDLIYX.wIJn.MEUCICfSvx4nZ0tIXuDp0Jrlha-kRZtLDGqq0_tN1NCG3BaEAiEAqpG_UabBDWOWtiV27pK6VRVWJPEEXA3EUUXuKSGf9Zw
        options:
          model: qwen3.7-text-embedding
          dimmension: 1024

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dobao?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000

  mybatis-plus:
    mapper-locations: classpath:mapper/*.xml
  servlet:
    multipart:
      enabled: true
      max-file-size: 80MB
      max-request-size: 80MB

  # 登录态落 MySQL（SPRING_SESSION 表），后端重启不掉登录
  session:
    store-type: jdbc
    jdbc:
      # 默认值 embedded 只对内嵌库自动建表；本项目的库是 MySQL，用默认值首个请求就会报
      # Table 'dobao.SPRING_SESSION' doesn't exist。生产改成 never 并手工执行建表脚本。
      initialize-schema: always
      table-name: SPRING_SESSION

minio:
  url: http://127.0.0.1:9000/
  accessKey: admin
  secretKey: admin@123456
  bucketName: dobao-agent
  endpoint: http://127.0.0.1:9000/
  # 生产环境对外可达的 MinIO 域名（MinioPublicUrlProvider 使用）。
  # dev 留空：dev 走百炼临时文件上传，不需要公网域名。
  public-base-url: ${MINIO_PUBLIC_BASE_URL:}

# 面试总结
interview:
  asr:
    # 必须带 /api/v1，否则 /uploads、/services/audio/asr/transcription、/tasks/{id} 全部 404
    base-url: ${DASHSCOPE_ASR_BASE_URL:https://ws-ae41waoyh0yzb53i.cn-beijing.maas.aliyuncs.com/api/v1}
    # 不写成裸 ${DASHSCOPE_API_KEY}：占位符无法解析会让整个应用启动失败
    api-key: ${DASHSCOPE_API_KEY:${spring.ai.openai.api-key}}
    model: qwen-audio-3.1-asr-flash-filetrans
    # 轮询间隔（毫秒），由 InterviewTaskService#pollTranscribingTasks 的 @Scheduled 读取
    poll-interval-ms: 5000
    # 30 分钟兜底超时。轮询不占用 interviewExecutor 线程，由 @Scheduled 扫描
    # status=TRANSCRIBING 的记录驱动（见 config/AsyncConfig.java）
    poll-timeout-ms: 1800000
    # true=dev 走百炼临时文件上传（本地无需公网域名）；false=prod 走 MinIO 公网地址。
    # 这是 dev/prod 的唯一切换开关，两个 profile 配置文件目前为空。
    temp-upload-enabled: true
    max-audio-bytes: 83886080        # 80MB，与 spring.servlet.multipart.max-file-size 对齐
    max-audio-duration-ms: 5400000   # 1.5 小时（模型支持 12 小时，这是产品侧约束）
  report:
    # 问答清单由转写句子直接格式化（QaListBuilder，零 LLM），本配置块只服务于
    # 「技术问题的参考回答 + 面试总结」那一次归纳调用。
    # 固定种子，配合低温保证同一份问答清单产出同一份知识点
    seed: 42
    # 透传给归纳请求体的厂商扩展参数。enable_thinking=false 关掉推理模型的思考，
    # 实测同一 prompt 下 completion 从 8064 token 降到 5075、耗时从 >150s 降到约 120s。
    # 参数名因服务商而异；写错通常表现为请求被拒，删掉这项即可恢复。
    extra-body:
      enable_thinking: false
    # extra-body 里真正下发到归纳调用的键。不加白名单的话"关思考"会顺带
    # 应用到对话 / PPT 那条链路（它们共用同一个 ChatModel）。
    extra-body-keys:
      - enable_thinking
    # 归纳专用模型（留空=沿用全局 spring.ai.openai.chat.options.model）。
    # 归纳是信息抽取任务，换更快的非推理模型可以省掉"思考" token。
    # model: qwen-plus
  # 实时进度流（SSE，GET /interview/{id}/stream）。
  # 心跳间隔同样由 InterviewProgressHub#heartbeat 的 @Scheduled 读取：转写阶段可能
  # 几分钟没有状态跳变，靠 ": ping" 注释帧保住长连接（前端忽略注释行；流断了会自动
  # 降级为轮询，两条通道共用同一份状态）
  stream:
    heartbeat-ms: 15000

